# Crystal React's gates, run on every push and pull request.
#
# Nothing here is a new check — each step already exists as a script. What this
# adds is that they run on somebody else's machine, on a clean checkout, before
# a change lands rather than after somebody remembers.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  # Re-runnable without an empty commit. A workflow that can only be triggered by
  # a push cannot be used to check whether a secret was set correctly, which is
  # the first thing anybody wants to check.
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tokens, types, tests and bundle
    runs-on: ubuntu-latest
    # Crystal is not a published package here: `@crystal/core` resolves to
    # `file:../crystal-design-system/design-system`, a *sibling* of this
    # repository, and the library reads its tokens, its resolver and its
    # stylesheets straight out of it. CONTRACT §1 is the reason — a second copy
    # of a value drifts from the first silently — so the layout on disk is part
    # of the build, and both checkouts go into the paths that dependency names.
    defaults:
      run:
        working-directory: crystal-react
    steps:
      - name: Check out Crystal React
        uses: actions/checkout@v5
        with:
          path: crystal-react

      # Crystal is checked out at its default branch, so this job always builds
      # against whatever Crystal's `main` is *at the moment the job starts*.
      # A change here that needs a new Crystal token therefore has to be pushed
      # second: push Crystal first, then this. Getting it the wrong way round
      # fails as `[sass] Undefined variable`, which reads like a typo in this
      # repository and is not one — it happened, fifteen seconds apart, when
      # `component.indicator.lineWidth` was added.
      - name: Check out Crystal beside it
        uses: actions/checkout@v5
        with:
          repository: boomerbowser/crystal
          path: crystal-design-system
          # Crystal is private. A repository-scoped token is needed; without one
          # this step is where the run stops, which is the honest place for it.
          token: ${{ secrets.CRYSTAL_HEAD_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          # package.json declares no `packageManager`, and without it this action
          # has nothing to read a version from and fails before installing.
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crystal-react/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Tokens first: everything below reads what this writes, and a stale
      # generated file makes every check beneath it evidence about the wrong
      # thing.
      - run: pnpm run tokens

      # No value is redeclared that Crystal already defines. This is CONTRACT §1
      # as a script, and it is first because it is the one that fails loudest
      # when somebody types a number.
      - run: pnpm run lint:tokens

      - run: pnpm run typecheck

      # Is the review surface reviewable? A ratchet over meta.component, args,
      # argTypes, play functions and action args, plus the one line in
      # preview.ts that puts Crystal's environment on every story.
      #
      # Meridian has reported a broken Storybook three times — a flat ground that
      # hid the material hierarchy, an environment nothing exposed, and a
      # Controls panel reading "This story has no controls" — and each time no
      # check in this repository was looking. It runs before the tests because it
      # is cheap and because a story nobody can operate makes every screenshot
      # beneath it evidence about the wrong thing.
      - run: node scripts/verify-stories.mjs

      # Both projects: unit in jsdom, and every story mounted in a real Chromium
      # with its play function and its accessibility checks. The second needs a
      # browser, which is why the install moved up here from the gates below.
      - run: npx playwright install --with-deps chromium
      - run: pnpm run test
      - run: pnpm run test:jest

      # Builds the library, checks what the bundle pulls in, and regenerates the
      # parity manifest.
      - run: pnpm run build

      - name: Generated files match their source
        run: |
          git diff --exit-code || {
            echo "::error::A build changed a committed file. Run pnpm build and commit the result."
            exit 1
          }

      # A story that throws is a component nobody can look at, and this project
      # has found a defect in a browser for every slice that tests passed.
      - run: pnpm run build-storybook

      # Target size, measured in a real browser against the built stories.
      #
      # This cannot run above with the unit tests: jsdom reports every box as
      # zero, so an assertion about a control's size passes there whatever the
      # control is. The tab strip was 36px against a stated 44px floor from the
      # day the segmented control shipped, with every test green.
      #
      # The static build is served rather than the dev server: it is what the
      # previous step already produced, and it removes the whole class of stale
      # transform that has twice sent this project chasing a defect that was not
      # in the source.
      # Four gates, one browser, four subjects. `verify:theme` asks whether the
      # properties the stylesheets read actually resolve — on the themed scope
      # and on the container every portalled overlay lives in. `verify:targets`
      # asks how big a control is. `verify:behaviour` asks what a component does
      # when the page scrolls or resizes. `verify:appearance` asks what a *state*
      # looks like — R-11, and the last of that entry's three checks to be
      # written.
      #
      # None of the four can be answered where the unit tests are: jsdom reports
      # every box as zero, ships no IntersectionObserver, and records a custom
      # property's name without ever computing what it resolves to. The scroll spy
      # was wrong three separate ways with twelve unit tests green.
      #
      # `verify:theme` runs first because it is the one whose failure explains the
      # others: a material built from a property that does not resolve is not a
      # weaker material, it is a syntax error, and every check beneath it is then
      # measuring a component with no styling.
      #
      # `verify:materials` is the aesthetic check, and it is the only one that
      # needs *both* servers: it renders the same material in Crystal's own
      # preview and in this library and compares the computed style. Neither
      # side's values are written down, so the expectation follows Crystal rather
      # than a copy of it. Meridian found the Resin rims missing before any gate
      # did, which is the argument for having this one.
      - name: Measure and drive the built stories
        run: |
          python3 -m http.server 6006 --directory storybook-static --bind 127.0.0.1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:6006/index.json >/dev/null && break
            sleep 0.5
          done
          pnpm run verify:theme
          pnpm run verify:targets
          pnpm run verify:behaviour

          # Every assertion in this one is a relationship and never a colour:
          # the focused control differs from itself at rest, the selected row is
          # heavier than its neighbour, and the disabled control differs from
          # itself enabled by more than opacity. A gate that asserts a colour is
          # a gate that fails on a palette change.
          #
          # The focus half is not hypothetical. --cr-focus-core and
          # --cr-focus-ring were read by every field in this library and defined
          # by nothing, so Crystal's focus ring painted on no control anywhere
          # through an entire slice, with every test green.
          pnpm run verify:appearance

          # Material parity needs Crystal's own preview beside the Storybook, so
          # the same material can be rendered in both and compared. Crystal is
          # already checked out for the token build; this serves it.
          python3 ../crystal-design-system/design-system/tools/serve.py &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:4321/ >/dev/null && break
            sleep 0.5
          done
          pnpm run verify:materials
        env:
          STORYBOOK_ORIGIN: http://127.0.0.1:6006

      - name: Keep the built storybook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: crystal-react/storybook-static
          retention-days: 7
          if-no-files-found: ignore
