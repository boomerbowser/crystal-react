# Crystal React's gates, run on every push and pull request.
#
# Every step already exists as a script. This workflow runs them on a clean
# checkout, on a machine nobody has edited, before a change lands.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  # Re-runnable without an empty commit. A workflow that only a push can trigger
  # cannot be used to check whether a secret was set correctly.
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tokens, types, tests and bundle
    runs-on: ubuntu-latest
    # Crystal is a published package: `@crystal-ui/core` is `^2.0.0` from npm,
    # and the library reads its tokens, its resolver and its stylesheets out of
    # `node_modules`. CONTRACT §1 is the reason: a second copy of a value drifts
    # from the first. A registry version is the same bytes for everyone and
    # cannot be edited underneath a build, which a sibling directory can.
    defaults:
      run:
        working-directory: crystal-react
    steps:
      - name: Check out Crystal React
        uses: actions/checkout@v5
        with:
          path: crystal-react

      # What is left of R-16, the push-ordering trap, which is closed. A
      # published version is the same bytes for every build and cannot be
      # half-pushed.
      #
      # The `file:` branch below only fires if somebody points the dependency
      # back at a working copy. That is reasonable for a change spanning both
      # repositories but must not be merged, and the step says so.
      - name: Crystal is present, and new enough
        run: |
          set -euo pipefail
          declared="$(node -p "const d=require('./package.json');(d.devDependencies?.['@crystal-ui/core'] ?? d.dependencies['@crystal-ui/core'])")"
          case "$declared" in
            file:*)
              # The declared path is used verbatim. Stripping the `../` would
              # fail a correct checkout.
              #
              # CI does not check Crystal out, so a `file:` range never resolves
              # here. The step names the missing path instead of leaving pnpm to
              # report it.
              here="${declared#file:}"
              if [ ! -d "$here" ]; then
                echo "::error::package.json depends on '$declared', and '$here' is not in this checkout."
                echo "::error::Nothing checks Crystal out in CI: the dependency is expected to be a published range like '^2.0.0'. A file: path works on a contributor's disk and nowhere else, so it cannot be merged."
                echo "::error::If this is a change spanning both repositories, publish Crystal first and depend on the version."
                exit 1
              fi
              echo "Crystal at $here — $(node -p "const p=require('$here/package.json');p.name+' '+p.version")"
              ;;
            *) echo "Depends on the published '$declared' — no sibling checkout needed." ;;
          esac

      - uses: pnpm/action-setup@v4
        with:
          # package.json declares no `packageManager`, and without it this action
          # has nothing to read a version from and fails before installing.
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crystal-react/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Tokens first: everything below reads what this writes, and a stale
      # generated file makes every check beneath it evidence about the wrong
      # thing.
      - run: pnpm run tokens

      # No value is redeclared that Crystal already defines. This is CONTRACT §1
      # as a script, and it is first because it is the one that fails loudest
      # when somebody types a number.
      - run: pnpm run lint:tokens

      - run: pnpm run typecheck

      # The review surface must be reviewable. A ratchet over meta.component,
      # args, argTypes, play functions and action args, plus the one line in
      # preview.ts that puts Crystal's environment on every story. It guards
      # against a flat ground that hides the material hierarchy, an environment
      # nothing exposes, and a Controls panel reading "This story has no
      # controls". It runs before the tests because it is cheap and because a
      # story nobody can operate makes every screenshot beneath it evidence
      # about the wrong thing.
      - run: node scripts/verify-stories.mjs

      # Both projects: unit in jsdom, and every story mounted in a real Chromium
      # with its play function and its accessibility checks. The second needs a
      # browser, so Playwright is installed here rather than with the gates
      # below.
      - run: npx playwright install --with-deps chromium
      - run: pnpm run test
      - run: pnpm run test:jest

      # Builds the library, checks what the bundle pulls in, and regenerates the
      # parity manifest.
      - run: pnpm run build

      - name: Generated files match their source
        run: |
          git diff --exit-code || {
            echo "::error::A build changed a committed file. Run pnpm build and commit the result."
            exit 1
          }

      # A story that throws is a component nobody can look at, and this project
      # has found defects in a browser that passing tests did not.
      - run: pnpm run build-storybook

      # The browser gates below measure the built stories in a real browser.
      #
      # They cannot run with the unit tests: jsdom reports every box as zero,
      # ships no IntersectionObserver, and records a custom property's name
      # without computing what it resolves to. The tab strip was 36px against a
      # stated 44px floor with every test green.
      #
      # The static build is served rather than the dev server: it is what the
      # previous step produced, and it cannot carry a stale transform.
      #
      # Four gates, one browser, four subjects. `verify:theme` asks whether the
      # properties the stylesheets read resolve, on the themed scope and on the
      # container every portalled overlay lives in. `verify:targets` asks how
      # big a control is. `verify:behaviour` asks what a component does when
      # the page scrolls or resizes. `verify:appearance` asks what a state
      # looks like (R-11).
      #
      # `verify:theme` runs first because its failure explains the others: a
      # material built from a property that does not resolve is a syntax
      # error, and every check beneath it then measures a component with no
      # styling.
      #
      # `verify:materials` is the aesthetic check and the only one that needs
      # both servers: it renders the same material in Crystal's own preview and
      # in this library and compares the computed style. Neither side's values
      # are written down, so the expectation follows Crystal rather than a copy
      # of it, and this library cannot drift from Crystal while its own tests
      # stay green.
      #
      # Crystal's site is built rather than only checked out. The site reaches
      # the library through a copy its build makes, that copy is gitignored,
      # and serve.py refuses to start without it. A site served without Crystal
      # renders, and looks like a design regression.
      #
      # crystal-preview is private (`crystal` is public), so this needs a
      # repository-scoped token. Without the token `actions/checkout` reports
      # "Not Found", which reads like a typo in the repository name.
      - name: Check out Crystal's site
        uses: actions/checkout@v5
        with:
          repository: boomerbowser/crystal-preview
          path: crystal-preview
          token: ${{ secrets.CRYSTAL_HEAD_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build Crystal's site
        working-directory: crystal-preview
        run: |
          npm ci --no-audit --no-fund
          pip install -r tools/requirements.txt
          npm run build

      - name: Measure and drive the built stories
        run: |
          python3 -m http.server 6006 --directory storybook-static --bind 127.0.0.1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:6006/index.json >/dev/null && break
            sleep 0.5
          done
          pnpm run verify:theme
          pnpm run verify:targets
          pnpm run verify:behaviour

          # Every assertion in this one is a relationship, never a colour: the
          # focused control differs from itself at rest, the selected row is
          # heavier than its neighbour, and the disabled control differs from
          # itself enabled by more than opacity. A gate that asserts a colour
          # fails on a palette change.
          #
          # The focus half guards against a property that is read but never
          # defined: when --cr-focus-core and --cr-focus-ring were read by every
          # field in this library and defined by nothing, no control painted a
          # focus ring and every test passed.
          pnpm run verify:appearance

          # Material parity needs Crystal's own site beside the Storybook, so
          # the same material can be rendered in both and compared. It is
          # checked out and built in the step above. The site reaches the
          # library through a copy that the build makes, and serve.py refuses
          # to start without it. A site served without Crystal renders, and
          # looks like a design regression.
          python3 ../crystal-preview/tools/serve.py &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:4321/ >/dev/null && break
            sleep 0.5
          done
          pnpm run verify:materials
        env:
          STORYBOOK_ORIGIN: http://127.0.0.1:6006

      - name: Keep the built storybook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: crystal-react/storybook-static
          retention-days: 7
          if-no-files-found: ignore
